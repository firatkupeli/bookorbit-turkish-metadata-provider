[project]
name = "bookorbit-turkish-metadata-provider"
version = "0.4.0"
requires-python = ">=3.12"
description = "Modular Turkish metadata provider for BookOrbit"
license = "MIT"
dependencies = [
    "defusedxml==0.7.1",
    "pillow==13.0.0",
    "beautifulsoup4==4.15.0",
    "cachetools==8.0.3",
    "fastapi==0.165.0",
    "httpx==0.29.0",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "uvicorn==0.49.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
]
